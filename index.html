<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parami Tracker - ပါရမီ မှတ်တမ်း</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Pyidaungsu', Arial, sans-serif; padding: 20px; background: #e9ecef; }
        .container { max-width: 450px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; } 
        h2 { color: #333; margin: 0 0 5px 0; }
        p.subtitle { color: #666; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-register { background: #28a745; color: white; }
        .btn-login { background: #007bff; color: white; }
        .btn-logout { background: #dc3545; color: white; }
        .btn-update { background: #ffc107; color: #333; }
        .hidden { display: none; }
        #total-box { background: #d4edda; color: #155724; padding: 20px; font-size: 22px; font-weight: bold; border-radius: 8px; margin-bottom: 20px; border: 1px solid #c3e6cb; }
        .warning-box { color: #856404; background: #fff3cd; padding: 15px; border-radius: 6px; border: 1px solid #ffeeba; margin-top: 15px; font-weight: bold; }
        .saving-section { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .saving-section h3 { margin-top: 0; color: #0056b3; }
        #my-saving { font-size: 20px; color: #d32f2f; }
        #error-log { color: red; font-weight: bold; margin-top: 10px; word-wrap: break-word; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="Parami Tracker Logo" class="logo" onerror="this.style.display='none'">
    <h2>🙏 Parami Tracker</h2>
    <p class="subtitle">ပါရမီ မှတ်တမ်း (ကုသိုလ်ဖြစ် ရန်ပုံငွေ)</p>

    <!-- Error တွေပေါ်မယ့်နေရာ (အရေးကြီးဆုံးအပိုင်း) -->
    <div id="error-log"></div>

    <div id="auth-section">
        <input type="text" id="username" placeholder="အမည် (Username)">
        <input type="password" id="password" placeholder="စကားဝှက် (Password ၆ လုံးအထက်)">
        <button class="btn-login" onclick="login()">ဝင်ရောက်မည်</button>
        <button class="btn-register" onclick="register()">အကောင့်အသစ်လုပ်မည်</button>
        <p id="auth-msg" style="color: blue; font-size: 14px; font-weight: bold;"></p>
    </div>

    <div id="dashboard-section" class="hidden">
        <div id="pending-msg" class="warning-box hidden">
            ⏳ Admin မှ ခွင့်ပြုချက် မပေးသေးပါ။<br>ခေတ္တစောင့်ဆိုင်းပေးပါ။
        </div>
        <div id="approved-content" class="hidden">
            <div id="total-box">စုစုပေါင်း ရန်ပုံငွေ<br><span id="total-amount">0</span> ကျပ်</div>
            <div class="saving-section">
                <h3>မိမိ၏ စုငွေစာရင်း</h3>
                <p>လက်ရှိ သင့်စုငွေ: <b id="my-saving">0</b> ကျပ်</p>
                <input type="number" id="new-amount" placeholder="စုငွေ ပမာဏအသစ် ရိုက်ထည့်ပါ">
                <button class="btn-update" onclick="updateSaving()">သိမ်းဆည်းမည် (Update)</button>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()" style="margin-top: 20px;">အကောင့်မှ ထွက်မည်</button>
    </div>
</div>

<script>
    // ဖုန်းစခရင်ပေါ်မှာ Error တွေကို အတိအကျပြပေးမယ့်စနစ်
    window.onerror = function(msg, url, lineNo) {
        document.getElementById('error-log').innerText += "\nSystem Error: " + msg + " (Line: " + lineNo + ")";
        return false;
    };

    const SUPABASE_URL = 'https://kejqfatcmxxvjuseikhd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlanFmYXRjbXh4dmp1c2Vpa2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjExNjksImV4cCI6MjEwNzkzNzE2OX0.uBfqOcLzSC_vdd2xH2U3HHryebZx5Hm6ZhHVcp7EMro';

    const myDB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const PSEUDO_DOMAIN = '@paramitracker.com';

    async function register() {
        try {
            let user = document.getElementById('username').value.trim().replace(/\s+/g, '');
            const pass = document.getElementById('password').value;
            
            if(!user || pass.length < 6) return alert("Username ထည့်ပါ။ Password အနည်းဆုံး ၆ လုံး ရှိရပါမည်။");

            document.getElementById('auth-msg').innerText = "အကောင့် ဖွင့်နေပါသည်...";

            const { data, error } = await myDB.auth.signUp({
                email: user + PSEUDO_DOMAIN,
                password: pass
            });

            if (error) {
                document.getElementById('error-log').innerText = "Supabase Error: " + error.message;
                document.getElementById('auth-msg').innerText = "အမှားရှိနေပါသည် (သို့) ဒီ Username ရှိပြီးသားပါ။";
            } else {
                alert("အကောင့်ဖွင့်ပြီးပါပြီ။ Admin ခွင့်ပြုချက်ကို စောင့်ပါ။");
                document.getElementById('auth-msg').innerText = "";
                document.getElementById('error-log').innerText = "";
                checkUser();
            }
        } catch (err) {
            document.getElementById('error-log').innerText = "JS Error: " + err.message;
        }
    }

    async function login() {
        try {
            let user = document.getElementById('username').value.trim().replace(/\s+/g, '');
            const pass = document.getElementById('password').value;
            
            if(!user || !pass) return alert("Username နှင့် Password ရိုက်ထည့်ပါ။");
            document.getElementById('auth-msg').innerText = "ဝင်ရောက်နေပါသည်...";

            const { data, error } = await myDB.auth.signInWithPassword({
                email: user + PSEUDO_DOMAIN,
                password: pass
            });

            if (error) {
                document.getElementById('error-log').innerText = "Supabase Error: " + error.message;
                document.getElementById('auth-msg').innerText = "Username သို့မဟုတ် Password မှားနေပါသည်။";
            } else {
                document.getElementById('auth-msg').innerText = "";
                document.getElementById('error-log').innerText = "";
                checkUser();
            }
        } catch (err) {
            document.getElementById('error-log').innerText = "JS Error: " + err.message;
        }
    }

    async function logout() {
        await myDB.auth.signOut();
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    async function checkUser() {
        try {
            const { data: { user } } = await myDB.auth.getUser();
            
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                
                const { data: memberData } = await myDB
                    .from('members')
                    .select('is_approved')
                    .eq('id', user.id)
                    .single();

                if (memberData && memberData.is_approved) {
                    document.getElementById('approved-content').classList.remove('hidden');
                    document.getElementById('pending-msg').classList.add('hidden');
                    loadSavings(user.id);
                } else {
                    document.getElementById('pending-msg').classList.remove('hidden');
                    document.getElementById('approved-content').classList.add('hidden');
                }
            }
        } catch (err) {
             console.log(err);
        }
    }

    async function loadSavings(userId) {
        try {
            const { data: allSavings } = await myDB.from('savings').select('id, saved_amount');
            if (allSavings) {
                let total = allSavings.reduce((sum, record) => sum + Number(record.saved_amount), 0);
                document.getElementById('total-amount').innerText = total.toLocaleString(); 
                let myData = allSavings.find(r => r.id === userId);
                if(myData) {
                    document.getElementById('my-saving').innerText = Number(myData.saved_amount).toLocaleString();
                }
            }
        } catch (err) {}
    }

    async function updateSaving() {
        try {
            const newAmount = document.getElementById('new-amount').value;
            if(!newAmount || isNaN(newAmount)) return alert("ငွေပမာဏကို ဂဏန်းဖြင့်သာ ရိုက်ထည့်ပါ။");

            const { data: { user } } = await myDB.auth.getUser();
            const btn = document.querySelector('.btn-update');
            btn.innerText = "သိမ်းဆည်းနေသည်...";
            
            const { error } = await myDB.from('savings').update({ saved_amount: Number(newAmount), updated_at: new Date() }).eq('id', user.id);

            btn.innerText = "သိမ်းဆည်းမည် (Update)";

            if (error) {
                document.getElementById('error-log').innerText = "Update Error: " + error.message;
            } else {
                alert("အောင်မြင်စွာ သိမ်းဆည်းလိုက်ပါပြီ။");
                document.getElementById('new-amount').value = '';
                loadSavings(user.id); 
            }
        } catch (err) {
             document.getElementById('error-log').innerText = "Update Exception: " + err.message;
        }
    }

    checkUser();
</script>
</body>
</html>
