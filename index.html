<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parami Group Members</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Padauk) -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- App Container -->
    <div id="app-container" class="container">
        
        <!-- ပင်မစာမျက်နှာ / ငွေစာရင်းသွင်းရန် -->
        <div id="section-home" class="content-section">
            <div class="card">
                <h2>ငွေသွင်း / ငွေပြန်နှုတ် မှတ်တမ်း</h2>
                
                <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <select id="trans-currency" style="padding: 10px; border-radius: 8px; border: 1px solid #d1d5db;">
                        <option value="MMK">MMK</option>
                        <option value="THB">THB</option>
                    </select>
                    <input type="number" id="trans-amount" placeholder="ငွေပမာဏ" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; box-sizing: border-box;">
                </div>

                <input type="text" id="trans-note" placeholder="မှတ်ချက် ရိုက်ထည့်ရန်" style="width: 100%; margin-bottom: 12px; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; box-sizing: border-box;">

                <!-- အလှူရှင် Checkbox နှင့် Form -->
                <div class="donor-box" style="margin-bottom: 15px; background: #f9fafb; padding: 15px; border-radius: 10px; border: 1px solid #e5e7eb;">
                    <label style="display: flex; align-items: center; gap: 10px; font-weight: bold; cursor: pointer; color: var(--primary); font-size: 14px;">
                        <input type="checkbox" id="is-donor-checkbox" onclick="toggleDonorForm()" style="width: 20px; height: 20px; cursor: pointer;">
                        <span>ပြင်ပအလှူရှင်မှ လှူဒါန်းခြင်းဖြစ်ပါက ဤနေရာကို နှိပ်ပါ</span>
                    </label>

                    <div id="donor-form-section" style="display: none; margin-top: 15px;">
                        <label style="font-size: 13px; font-weight: bold; color: #374151; display: block; margin-bottom: 5px;">အလှူရှင် အမည်</label>
                        <input type="text" id="donor-name" placeholder="အလှူရှင် အမည်ထည့်ရန်" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #d1d5db; box-sizing: border-box;">

                        <label style="font-size: 13px; font-weight: bold; color: #374151; display: block; margin-bottom: 5px;">လိပ်စာ / ဆက်သွယ်ရန်</label>
                        <input type="text" id="donor-address" placeholder="လိပ်စာ ထည့်ရန်" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #d1d5db; box-sizing: border-box;">

                        <label style="font-size: 13px; font-weight: bold; color: #374151; display: block; margin-bottom: 5px;">အလှူရှင် ပုံ (သို့မဟုတ် ကုသိုလ်ဖြစ် ပုံ)</label>
                        <input type="file" id="donor-photo-file" class="file-upload" accept="image/*">
                        <img id="preview-donor-photo" src="" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; display: none; margin-top: 8px;">
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="addTransaction('deposit')" style="flex: 1; background: #059669; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">ငွေသွင်းမည်</button>
                    <button onclick="addTransaction('withdraw')" style="flex: 1; background: #dc2626; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">ငွေပြန်နှုတ်မည်</button>
                </div>
            </div>

            <!-- ငွေစာရင်း မှတ်တမ်းများ -->
            <div class="card" style="margin-top: 20px;">
                <h2>ငွေစာရင်း မှတ်တမ်းများ</h2>
                <div id="transactions-list">
                    <p style="color: #6b7280;">မှတ်တမ်း မရှိသေးပါခင်ဗျာ။</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchSection('home')">
            <i class="fas fa-home"></i>
            <span>ပင်မစာမျက်နှာ</span>
        </div>
        <div class="nav-item" onclick="switchSection('wallet')">
            <i class="fas fa-wallet"></i>
            <span>ငွေစာရင်း သွင်း/ထုတ်</span>
        </div>
        <div class="nav-item" onclick="switchSection('users')">
            <i class="fas fa-users"></i>
            <span>Users</span>
        </div>
        <div class="nav-item" onclick="switchSection('settings')">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
        </div>
        <div class="nav-item" onclick="switchSection('admin')">
            <i class="fas fa-shield-alt"></i>
            <span>Admin Panel</span>
        </div>
        <div class="nav-item logout" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>ထွက်မည်</span>
        </div>
    </div>

    <!-- JavaScript Script Link -->
    <script src="script.js"></script>
    <script>
        function toggleDonorForm() {
            const checkbox = document.getElementById('is-donor-checkbox');
            const formSection = document.getElementById('donor-form-section');
            formSection.style.display = checkbox.checked ? 'block' : 'none';
        }
    </script>
</body>
</html>
